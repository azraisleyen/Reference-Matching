[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-refmatch"
version = "0.1.0"
description = "Causal static/dynamic reference matching research baseline"
requires-python = ">=3.11,<3.13"
dependencies = [
 "numpy==2.2.6", "opencv-python-headless==4.12.0.88", "av==16.0.1",
 "pillow==11.3.0", "pydantic==2.11.10", "PyYAML==6.0.3", "psutil==7.1.3",
 "filelock==3.20.0", "torch==2.9.1", "torchvision==0.24.1",
 "transformers==4.57.6", "timm==1.0.22", "einops==0.8.1",
 "gradio==6.0.2", "kornia==0.8.2", "loguru==0.7.3",
 "yacs==0.1.8", "joblib==1.5.2", "pytorch-lightning==2.5.6",
 "fastapi==0.119.1", "starlette==0.48.0"
]
[project.optional-dependencies]
dev = ["pytest==9.0.1", "ruff==0.14.6"]
[project.scripts]
uav-refmatch = "uav_refmatch.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real checkpoints and explicit opt-in"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
